name: Update market news

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,14,17,20 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch official market news
        run: node scripts/update-market-news.mjs

      - name: Commit updated news
        run: |
          git add data/market-news.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update market news"
            git push
          fi
